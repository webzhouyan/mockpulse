name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            package-cmd: npm --prefix packages/app run package:win
          - os: macos-latest
            platform: mac
            package-cmd: npm --prefix packages/app run package:mac:unsigned
          - os: ubuntu-latest
            platform: linux
            package-cmd: npm --prefix packages/app run package:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build common libraries
        run: npm run build:libs

      - name: Build desktop production bundle
        run: npm run build:desktop:prod

      - name: Package desktop application (${{ matrix.platform }})
        run: ${{ matrix.package-cmd }}

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            packages/app/packages/*.exe
            packages/app/packages/*.dmg
            packages/app/packages/*.zip
            packages/app/packages/*.AppImage
            packages/app/packages/*.deb
            packages/app/packages/*.rpm
            packages/app/packages/*.blockmap
            packages/app/packages/*.yml
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist-release
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: ./dist-release
        run: |
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          ls -la

      - name: Prepare Release Notes
        run: |
          CLEAN_VER="${{ steps.release_tag.outputs.clean_version }}"

          echo "### 📦 安装包下载 (Downloads)" > release_body.md
          echo "" >> release_body.md
          echo "| 操作系统 | 安装包格式 | 说明 |" >> release_body.md
          echo "| :--- | :--- | :--- |" >> release_body.md
          echo "| 🪟 **Windows (x64)** | \`MockPulse-${CLEAN_VER}.exe\` | 标准安装程序（支持自定义安装路径） |" >> release_body.md
          echo "| 🪟 **Windows (x64)** | \`MockPulse-portable-${CLEAN_VER}.exe\` | 绿色便携版免安装，解压直接运行 |" >> release_body.md
          echo "| 🍎 **macOS (Apple Silicon)** | \`MockPulse-${CLEAN_VER}.arm64.dmg\` | 适用于 M1/M2/M3/M4 系列 Mac |" >> release_body.md
          echo "| 🍎 **macOS (Intel)** | \`MockPulse-${CLEAN_VER}.x64.dmg\` | 适用于 Intel 架构 Mac |" >> release_body.md
          echo "| 🐧 **Linux (x64)** | \`MockPulse-${CLEAN_VER}.x86_64.AppImage\` | 通用独立可执行文件，双击即运行 |" >> release_body.md
          echo "| 🐧 **Linux (Debian/Ubuntu)** | \`MockPulse-${CLEAN_VER}.amd64.deb\` | \`sudo dpkg -i MockPulse-${CLEAN_VER}.amd64.deb\` |" >> release_body.md
          echo "| 🐧 **Linux (Fedora/RHEL)** | \`MockPulse-${CLEAN_VER}.x86_64.rpm\` | \`sudo rpm -ivh MockPulse-${CLEAN_VER}.x86_64.rpm\` |" >> release_body.md
          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "### 📝 更新内容 (Changelog)" >> release_body.md
          echo "" >> release_body.md

          # 从 CHANGELOG.md 中提取当前发布版本的变更记录
          awk -v ver="${CLEAN_VER}" '
            BEGIN { found=0 }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >> release_body.md

          cat release_body.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: MockPulse ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          body_path: release_body.md
          files: |
            ./dist-release/*
